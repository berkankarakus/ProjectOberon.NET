name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and run deterministic tests
        run: bash scripts/verify-dotnet.sh

  boot-integration:
    if: ${{ vars.PROJECT_OBERON_DISK_URL != '' && vars.PROJECT_OBERON_DISK_SHA256 != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download compatible disk image
        env:
          PROJECT_OBERON_DISK_URL: ${{ vars.PROJECT_OBERON_DISK_URL }}
        run: curl --fail --location --retry 3 "$PROJECT_OBERON_DISK_URL" --output RISC-work.img

      - name: Verify disk image checksum
        env:
          PROJECT_OBERON_DISK_SHA256: ${{ vars.PROJECT_OBERON_DISK_SHA256 }}
        run: echo "$PROJECT_OBERON_DISK_SHA256  RISC-work.img" | sha256sum --check --status

      - name: Build and run boot/input integration
        env:
          PROJECT_OBERON_DISK: ${{ github.workspace }}/RISC-work.img
          PROJECT_OBERON_RUN_DISK_TESTS: "1"
        run: bash scripts/verify-dotnet.sh
