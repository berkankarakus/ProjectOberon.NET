name: .NET CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install SDL2 runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsdl2-2.0-0

      - name: Build and run deterministic tests
        env:
          PROJECT_OBERON_DOTNET_ARTIFACTS: ${{ github.workspace }}/artifacts/dotnet
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/verify-dotnet.sh 2>&1 | tee artifacts/verify-dotnet.log

      - name: Run SDL dummy frontend smoke
        env:
          SDL_VIDEODRIVER: dummy
          PROJECT_OBERON_DOTNET_ARTIFACTS: ${{ github.workspace }}/artifacts/dotnet
        run: |
          set -o pipefail
          "$PROJECT_OBERON_DOTNET_ARTIFACTS/bin/ProjectOberon.SdlUi/release/ProjectOberon.SdlUi" \
            --frames 1 --steps-per-frame 1 --scale 0.5 2>&1 | tee -a artifacts/verify-dotnet.log

      - name: Upload deterministic test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-ci-${{ github.run_id }}-${{ github.job }}
          path: |
            artifacts/verify-dotnet.log
            artifacts/traces/**
          if-no-files-found: ignore
          retention-days: 14

  boot-integration:
    if: ${{ vars.PROJECT_OBERON_DISK_URL != '' && vars.PROJECT_OBERON_DISK_SHA256 != '' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download compatible disk image archive
        env:
          PROJECT_OBERON_DISK_URL: ${{ vars.PROJECT_OBERON_DISK_URL }}
        run: curl --fail --location --retry 3 "$PROJECT_OBERON_DISK_URL" --output RISCimg.zip

      - name: Verify disk image archive checksum
        env:
          PROJECT_OBERON_DISK_SHA256: ${{ vars.PROJECT_OBERON_DISK_SHA256 }}
        run: echo "$PROJECT_OBERON_DISK_SHA256  RISCimg.zip" | sha256sum --check --status

      - name: Extract disk image
        run: unzip -p RISCimg.zip RISC.img > RISC-work.img

      - name: Build and run boot/input integration
        env:
          PROJECT_OBERON_DISK: ${{ github.workspace }}/RISC-work.img
          PROJECT_OBERON_RUN_DISK_TESTS: "1"
          PROJECT_OBERON_DOTNET_ARTIFACTS: ${{ github.workspace }}/artifacts/dotnet
        run: |
          mkdir -p artifacts
          set -o pipefail
          bash scripts/verify-dotnet.sh 2>&1 | tee artifacts/verify-dotnet.log

      - name: Upload boot integration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-boot-ci-${{ github.run_id }}-${{ github.job }}
          path: |
            artifacts/verify-dotnet.log
            artifacts/traces/**
          if-no-files-found: ignore
          retention-days: 14
